#Service id(Application name)
spring.application.name=config-server

#Server Port
server.port=8888

#Link config server with GitHub account(external config file)
spring.cloud.config.server.git.uri=https://github.com/shubhamparanjape21/ecommerce-microservices-config.git

#logging properties
logging.level.root=INFO
logging.level.com.japes.discoveryserver=DEBUG
logging.file.name=logs/config-server.log 