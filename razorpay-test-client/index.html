<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Razorpay Test Payment</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>

    <h2>Razorpay Test Payment</h2>

    <button onclick="startPayment()">
        Pay ₹399
    </button>

    <script>

        async function startPayment() {

            // Step 1: Call our Payment Service
            const response = await fetch(
                "http://localhost:8084/api/v1/payments/initiate/PAY-B41678EE",
                {
                    method: "POST"
                }
            );

            if (!response.ok) {
                alert("Unable to initiate payment");
                return;
            }

            const payment = await response.json();

            console.log("Payment initiation response:", payment);

            // Step 2: Configure Razorpay Checkout
            const options = {

                key: payment.razorpayKeyId,

                amount: payment.amount * 100,

                currency: payment.currency,

                name: "Japes Ecommerce Microservices",

                description: "Test Payment",

                order_id: payment.razorpayOrderId,

                handler: async function (response) {

                    console.log("Razorpay response:", response);

                    const verifyResponse = await fetch(
                        "http://localhost:8084/api/v1/payments/verify",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                razorpayOrderId: response.razorpay_order_id,
                                razorpayPaymentId: response.razorpay_payment_id,
                                razorpaySignature: response.razorpay_signature
                            })
                        }
                    );

                    const result = await verifyResponse.json();

                    console.log("Verification response:", result);

                    if (verifyResponse.ok) {
                        alert("Payment verified successfully!");
                    } else {
                        alert("Payment verification failed!");
                    }
                }
            };

            // Step 3: Open Razorpay Checkout
            const razorpay =
                new Razorpay(options);

            razorpay.open();
        }

    </script>

</body>

</html>
